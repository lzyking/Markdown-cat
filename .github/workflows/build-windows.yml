name: Build Windows App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri Windows App
        run: npm run tauri:build

      - name: Create Portable Zip Package (免安装绿化版)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/target/release/portable"
          Get-ChildItem -Path "src-tauri/target/release" -Filter "*.exe" -File | Where-Object { $_.Name -notlike "*setup*" -and $_.Name -notlike "*installer*" } | Copy-Item -Destination "src-tauri/target/release/portable/Markdown-Cat.exe"
          Compress-Archive -Path "src-tauri/target/release/portable/*" -DestinationPath "src-tauri/target/release/Markdown-Cat-Portable-Windows.zip" -Force

      - name: Upload Windows Packages (Portable Zip & Non-Admin Installer)
        uses: actions/upload-artifact@v4
        with:
          name: Markdown-Cat-Windows-Packages
          path: |
            src-tauri/target/release/Markdown-Cat-Portable-Windows.zip
            src-tauri/target/release/bundle/nsis/*.exe
