name: Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri App
        run: npm run tauri:build

      - name: Package macOS Portable App (.zip)
        if: matrix.platform == 'macos'
        run: |
          cd src-tauri/target/release/bundle/macos
          zip -r ../Markdown-Cat-macOS.zip "Markdown Cat.app"

      - name: Package Windows Executables (安装包与免安装绿化包)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/target/release/portable"
          Copy-Item "src-tauri/target/release/markdown-cat.exe" "src-tauri/target/release/portable/Markdown-Cat.exe"
          Compress-Archive -Path "src-tauri/target/release/portable/*" -DestinationPath "src-tauri/target/release/bundle/Markdown-Cat-Portable-Windows.zip" -Force
          $nsisExe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if ($nsisExe) {
            Copy-Item $nsisExe.FullName "src-tauri/target/release/bundle/Markdown-Cat-Windows-Setup.exe" -Force
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Markdown-Cat-${{ matrix.platform }}-Packages
          if-no-files-found: ignore
          path: |
            src-tauri/target/release/bundle/*.zip
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Release Packages to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/release/bundle/*.zip
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


