[package]
name = "markdown-cat"
version = "0.2.0"
description = "A portable Markdown editor built with Tauri 2.x and Vue 3"
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.80"

[lib]
name = "markdown_cat_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "markdown-cat"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.1.1", features = [] }

[dependencies]
tauri = { version = "2.1.1", features = [] }
tauri-plugin-fs = "2.2.1"
tauri-plugin-dialog = "2.2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
tempfile = "3.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
